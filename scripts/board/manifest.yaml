# Board manifest — generated from docs/SPEC.md by `npm run board:derive`.
# Do not edit by hand: change docs/SPEC.md and re-derive, then run
# `npm run board:sync`. Ids key the GitHub issues, so never change them.

- id: CLI-1
  title: Help and usage
  full: gitlogstats --help lists every option with a short description.
  section: §5 Command-Line Interface
  family: CLI
  phase: 1
  status: Done
- id: CLI-2
  title: Input validation
  full: Invalid dates, and a start date after the end date, are rejected with a
    usage error and exit status 2 instead of a stack trace.
  section: §5 Command-Line Interface
  family: CLI
  phase: 1
  status: Done
- id: CLI-3
  title: GitHub pull-request statistics
  full: "--github adds GitHub pull-request statistics (STAT-8 to STAT-11) for
    repositories hosted on github.com, appending the columns github_username,
    prs_opened, prs_merged, prs_closed_unmerged to every output format. Without
    --github, the output and behaviour are unchanged, GitHub is never contacted
    and the GitHub CLI (gh) is not needed. With --github, the GitHub API is
    called through gh api, so gh must be installed and signed in. This is
    checked before any repository is cloned; if it fails, nothing is printed to
    standard output, the tool exits with status 1, and one plain message on
    standard error says why and what to do — no stack trace: gh not found:
    gitlogstats: --github needs the GitHub CLI…"
  section: §5 Command-Line Interface
  family: CLI
  phase: 1
  status: Done
- id: FILT-1
  title: Date range
  full: "-s/--start and -e/--end (format mm/dd/yyyy) limit the analysis to commits
    whose commit date falls between the start of the start date and the end of
    the end date, inclusive, in local time. Defaults: one year ago until today.
    The output records the requested start and end dates on every row. With
    --github, each pull request count is filtered by its own timestamp in the
    same range (CLI-3)."
  section: §3 Filtering
  family: FILT
  phase: 1
  status: Done
- id: FILT-2
  title: Single contributor
  full: -u/--user <name> reports only the contributor whose author name or email
    address matches exactly. Without -u, every contributor in the repository's
    history is reported. With --github, it selects the combined row, and a value
    may also be the GitHub username (ignoring case); see CLI-3.
  section: §3 Filtering
  family: FILT
  phase: 1
  status: Done
- id: FILT-3
  title: File exclusions
  full: '-x/--exclusions takes a comma-separated list of file names, glob patterns
    or directories to leave out of the analysis, matched in any directory. A
    directory name (vendor or vendor/) excludes everything inside it, and a path
    pattern (docs/.md) matches inside directories of that name. Surrounding
    spaces and empty items are ignored. The list replaces the defaults, and -x
    "" excludes nothing. Exclusions apply to commits, lines and files, but not
    to merges (STAT-7). By default common generated and binary files are
    excluded: package.json, package-lock.json, Pipfile, Pipfile.lock,
    requirements.txt, .jpg, .png, .gif, .svg, .pdf, .zip, .gz, .tar, .csv,
    .json.'
  section: §3 Filtering
  family: FILT
  phase: 1
  status: Done
- id: FILT-4
  title: Remove inactive contributors
  full: By default, contributors with no activity in the date range are listed
    with zeros. -c/--clean removes them. With --github, only rows with neither
    git nor pull-request activity are removed (CLI-3).
  section: §3 Filtering
  family: FILT
  phase: 1
  status: Done
- id: OUT-1
  title: CSV output
  full: -f csv (the default) prints a header row followed by one row per
    contributor per repository, with fields username, repository, start_date,
    end_date, commits, insertions, deletions, files, merges. New fields are
    added at the end so existing column positions do not change. Values
    containing commas, quotes or line breaks are quoted. The header is printed
    even when there are no rows, and the output ends with a single newline. With
    --github, the columns github_username, prs_opened, prs_merged,
    prs_closed_unmerged are appended, and are in the header even when there are
    no rows (CLI-3).
  section: §4 Output
  family: OUT
  phase: 1
  status: Done
- id: OUT-2
  title: JSON output
  full: -f json prints a single JSON array of objects with the same fields, valid
    JSON even when several repositories are analyzed.
  section: §4 Output
  family: OUT
  phase: 1
  status: Done
- id: OUT-3
  title: Markdown output
  full: -f markdown prints a Markdown table with the same columns. Pipe characters
    in values are escaped so they do not split cells.
  section: §4 Output
  family: OUT
  phase: 1
  status: Done
- id: OUT-4
  title: One combined result across repositories
  full: When several repositories are analyzed, the results are printed once,
    after all repositories are processed, as a single CSV table, JSON array or
    Markdown table.
  section: §4 Output
  family: OUT
  phase: 1
  status: Done
- id: OUT-5
  title: Verbose diagnostics
  full: -v/--verbose prints debugging information (directories, the git commands
    run, contributors found) to standard error, so standard output stays
    machine-readable. With --github, it also prints how each author name was
    matched to a GitHub user, the ambiguous and unmatched names, and the number
    of gh API calls made for each repository (CLI-3).
  section: §4 Output
  family: OUT
  phase: 1
  status: Done
- id: PKG-1
  title: Installable package
  full: The tool installs with pip install gitlogstats, which provides a
    gitlogstats command. It can also be run as python -m gitlogstats.
  section: §6 Packaging & Quality
  family: PKG
  phase: 1
  status: Done
- id: PKG-2
  title: Continuous integration and release
  full: GitHub Actions builds the package on Python 3.9 and 3.11 for every pull
    request into master and every push to master. It publishes to PyPI only when
    a pull request is merged into master and the build of the merged code
    passes; pushes to other branches publish nothing. A merge whose version is
    already on PyPI (no version bump) skips the upload instead of failing.
  section: §6 Packaging & Quality
  family: PKG
  phase: 1
  status: Done
- id: PKG-3
  title: Automated tests
  full: Unit tests cover parsing and formatting, and integration tests build real
    git repositories to check the statistics across commit-message shapes, kinds
    of change, author names, date boundaries, exclusions and the command-line
    options. Run with pytest.
  section: §6 Packaging & Quality
  family: PKG
  phase: 1
  status: Done
- id: PKG-4
  title: Run tests in CI
  full: The CI workflow runs the Python test suite (pytest) on every pull request
    into master and every push to master, and on the merged code before a
    release; a failing test stops the release.
  section: §6 Packaging & Quality
  family: PKG
  phase: 1
  status: Done
- id: REPO-1
  title: Single repository
  full: -r/--repository <url> analyzes one repository. Any URL or path that git
    clone accepts works, including HTTPS, SSH (git@host:user/repo.git) and local
    paths. Exactly one of -r or -rf is required.
  section: §1 Repository Selection
  family: REPO
  phase: 1
  status: Done
- id: REPO-2
  title: Repository list file
  full: -rf/--repofile <path> analyzes every repository listed in a plain text
    file, one URL per line. Surrounding whitespace is ignored, as are blank
    lines and lines starting with .
  section: §1 Repository Selection
  family: REPO
  phase: 1
  status: Done
- id: REPO-3
  title: Local clone cache
  full: Repositories are cloned into a repos/ directory under the current working
    directory, in a folder named the way git clone names it (the last path
    segment, minus a trailing .git; dots in the name are kept). On later runs
    the existing clone is updated with git pull instead of being cloned again.
  section: §1 Repository Selection
  family: REPO
  phase: 1
  status: Done
- id: REPO-4
  title: Branch selection
  full: -b/--branch <name> checks out the given branch before statistics are
    computed. Without -b, the repository's default branch is used — including
    when an earlier run left the cached clone on another branch. With --github,
    it also limits which pull requests are counted to those whose base branch is
    that branch (CLI-3).
  section: §1 Repository Selection
  family: REPO
  phase: 1
  status: Done
- id: STAT-1
  title: Commit count
  full: "For each contributor, the number of non-merge commits they authored in
    the date range. Merge commits are counted separately (STAT-7), not as
    commits. Commits that change no files (empty commits) and commits that only
    touch excluded files (FILT-3) are not counted. The count does not depend on
    git's history simplification: commits are never hidden because of how the
    exclusions interact with merges."
  section: §2 Contribution Statistics
  family: STAT
  phase: 1
  status: Done
- id: STAT-2
  title: Lines inserted and deleted
  full: For each contributor, the sum of lines inserted and lines deleted across
    their commits, as reported by git log --shortstat. Binary files add no
    lines. Merge commits add no lines, so work merged from a branch is never
    counted twice.
  section: §2 Contribution Statistics
  family: STAT
  phase: 1
  status: Done
- id: STAT-3
  title: Files changed
  full: For each contributor, the sum over their commits of the number of files
    each commit changed, as reported by git log --shortstat (binary files and
    renames included).
  section: §2 Contribution Statistics
  family: STAT
  phase: 1
  status: Done
- id: STAT-4
  title: Exact author attribution
  full: "Each commit is credited to exactly one contributor: the commit's author
    name. Names that are prefixes of each other (Al, Alice), or that contain
    spaces, quotes, brackets or other symbols, are kept apart and counted
    correctly. The per-contributor totals for a repository add up to the
    repository's totals."
  section: §2 Contribution Statistics
  family: STAT
  phase: 1
  status: Done
- id: STAT-5
  title: Statistics independent of commit messages
  full: "Statistics are correct whatever the commit messages contain: single-line,
    multi-line (with or without a blank line after the subject), empty,
    non-English, or text that looks like git log output (e.g. commit abc123 or 3
    files changed). Commit messages are never read; each commit's author and
    change summary come from a machine-readable git log format."
  section: §2 Contribution Statistics
  family: STAT
  phase: 1
  status: Done
- id: STAT-6
  title: Mailmap identities
  full: Author names are taken after applying the repository's .mailmap, so a
    developer who committed under several names or email addresses can be
    reported as one contributor when the repository maps them.
  section: §2 Contribution Statistics
  family: STAT
  phase: 1
  status: Done
- id: STAT-7
  title: Merge count
  full: "For each contributor, the number of merge commits they authored directly
    on the analyzed branch (its first-parent line) in the date range, reported
    in a merges column. The author of a merge commit is the person who merged,
    so this covers merges made locally and pushed, and pull requests merged on
    GitHub, GitLab or Bitbucket with a merge commit, where the hosting service
    is only the committer. Octopus merges count once. Not counted: fast-forward,
    squash and rebase merges (no merge commit exists); merges made inside other
    branches, such as merging the main branch into a feature branch to update
    it; merges on branches other than the analyzed one; and local merges that
    were never pushed. File…"
  section: §2 Contribution Statistics
  family: STAT
  phase: 1
  status: Done
- id: STAT-8
  title: Pull requests opened
  full: With --github (CLI-3), for each contributor, the number of pull requests
    they authored on GitHub whose creation time (created_at) falls in the date
    range, whatever their state now (open, merged or closed; drafts included).
    Reported in a prs_opened column.
  section: §2 Contribution Statistics
  family: STAT
  phase: 1
  status: Done
- id: STAT-9
  title: Pull requests merged
  full: With --github, for each contributor, the number of pull requests they
    authored that were merged (merged_at set) in the date range, whoever merged
    them. Reported in a prs_merged column. Unlike merges (STAT-7), this counts
    squash and rebase merges too, since GitHub records them as merged pull
    requests.
  section: §2 Contribution Statistics
  family: STAT
  phase: 1
  status: Done
- id: STAT-10
  title: Pull requests closed without merging
  full: With --github, for each contributor, the number of pull requests they
    authored that were closed without being merged (state closed and merged_at
    not set), with a closing time (closed_at) in the date range. Reported in a
    prs_closed_unmerged column.
  section: §2 Contribution Statistics
  family: STAT
  phase: 1
  status: Done
- id: STAT-11
  title: Matching GitHub users to git authors
  full: "With --github, each pull-request author (a GitHub username) is matched to
    the git identities (author name and email) in the repository's history. Each
    git identity is tried against the GitHub users active in that repository
    (pull-request authors and the accounts GitHub links to its commits), tier by
    tier, stopping at the first tier that finds exactly one GitHub user: 1.
    Email. The email is a GitHub noreply address
    (12345+login@users.noreply.github.com or login@users.noreply.github.com); or
    GitHub links one of the identity's commits to an account (the commit's
    author.login, which covers private emails GitHub knows but does not
    publish); or the email equals a candidate's public profile email…"
  section: §2 Contribution Statistics
  family: STAT
  phase: 1
  status: Done
